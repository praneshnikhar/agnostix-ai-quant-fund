# =============================================================================
# AI Quant Fund — CI (M0)
# Lint + typecheck + tests for api and web. No external services required:
# unit tests use mocks/fakes; integration tests are opt-in via env vars.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check apps/api services tests
      - name: Mypy (non-blocking in M0)
        run: mypy apps/api/app services --ignore-missing-imports || true
      - name: Tests (unit; integration skipped without infra)
        run: pytest apps/api/tests -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci || npm install
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: apps/web
        run: npm test
      - name: Build
        working-directory: apps/web
        run: npm run build
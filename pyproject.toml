# =============================================================================
# AI Quant Fund — Python tooling configuration (ruff + mypy + pytest)
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api", "services", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # bandit (security)
]
ignore = [
    "B008", # FastAPI dependency injection pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts allowed in tests
"services/market_data/tests/**" = ["S101"]
"services/fundamentals/tests/**" = ["S101"]
"apps/api/tests/**" = ["S101"]
# S101: workers use asserts as internal invariants on ingestion pipelines.
"apps/api/app/workers/**" = ["S101"]
# S105: StrEnum members like Verdict.PASS = "PASS" are not passwords.
"services/fundamentals/research/schemas.py" = ["S105"]
# S105: StrEnum members like Verdict.PASS = "pass" are not passwords,
# and settings defaults are placeholders, not credentials.
"apps/api/app/schemas/contracts.py" = ["S105"]
"apps/api/app/db/models.py" = ["S105"]
"apps/api/app/core/config.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = "apps/api"

[[tool.mypy.overrides]]
module = ["celery.*", "redis.*", "alpaca.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "apps/api/tests",
    "tests/integration",
    "services/market_data/tests",
    "services/fundamentals/tests",
]
markers = [
    "integration: tests requiring live infrastructure (deselect with '-m \"not integration\"')",
]
